# Step 5: GitHub Actions CI pipeline
# Runs on every push and pull request. If any step fails, the whole run fails (red X).
name: CI

on:
  push:
    branches: [main]        # run when code is pushed to main
  pull_request:             # also run on pull requests

jobs:
  build-test-train:
    runs-on: ubuntu-latest  # GitHub provides a fresh Linux machine

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip         # cache downloaded packages to speed up runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src tests api

      - name: Run unit tests
        run: pytest -v

      - name: Download dataset
        run: python src/download_data.py

      - name: Train models
        run: python src/train.py

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            models/metrics.json

      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
